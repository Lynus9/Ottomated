<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f2">
    <meta name="description" content="Ottomated. Coming soon.">
    <title>Ottomated | Coming Soon</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script src="./contact.js" defer></script>
  </head>
  <body>
    <main class="landing">
      <div class="sculpture" aria-hidden="true">
        <div class="aura"></div>
        <div class="ground-shadow"></div>
        <svg class="orbit orbit-back" viewBox="0 0 320 240" fill="none">
          <defs>
            <linearGradient id="rail" x1="40" y1="140" x2="284" y2="188" gradientUnits="userSpaceOnUse">
              <stop stop-color="#c5c4cd"/>
              <stop offset=".45" stop-color="#efeff2"/>
              <stop offset="1" stop-color="#b0acbf"/>
            </linearGradient>
          </defs>
          <ellipse cx="160" cy="164" rx="124" ry="37" transform="rotate(-13 160 164)" stroke="url(#rail)" stroke-width="1.5"/>
        </svg>
        <div class="buddy-float">
          <div class="buddy">
            <div class="face">
              <span class="eye"></span>
              <span class="eye"></span>
            </div>
          </div>
        </div>
        <svg class="orbit orbit-front" viewBox="0 0 320 240" fill="none">
          <path d="M36 164a124 37 0 0 0 248 0" transform="rotate(-13 160 164)" stroke="url(#rail)" stroke-width="1.5"/>
        </svg>
        <div class="satellite-plane">
          <div class="satellite-position"><div class="satellite"></div></div>
        </div>
      </div>
      <h1>Ottomated</h1>
      <p>Coming soon</p>
      <button class="contact-trigger" id="contact-trigger" type="button" aria-haspopup="dialog" aria-controls="contact-dialog" hidden>Contact Us</button>
    </main>
    <dialog class="contact-dialog" id="contact-dialog" aria-labelledby="contact-title">
      <div class="contact-panel">
        <button class="contact-close" type="button" aria-label="Close contact form" data-close-contact>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div id="contact-compose">
          <h2 id="contact-title">Contact us</h2>
          <form id="contact-form" action="https://formspree.io/f/mzeevpda" method="POST" novalidate>
            <fieldset class="contact-fields">
              <legend class="visually-hidden">Your contact details and message</legend>
              <div class="contact-field">
                <label for="contact-name">Name</label>
                <input id="contact-name" name="name" autocomplete="name" required aria-describedby="name-error">
                <span class="field-error" id="name-error" hidden></span>
              </div>
              <div class="contact-field">
                <label for="contact-email">Email</label>
                <input id="contact-email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
                <span class="field-error" id="email-error" hidden></span>
              </div>
              <div class="contact-field">
                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="message" rows="4" required aria-describedby="message-error"></textarea>
                <span class="field-error" id="message-error" hidden></span>
              </div>
            </fieldset>
            <p class="contact-error" id="contact-error" role="alert" aria-atomic="true"></p>
            <button class="contact-send" type="submit">Send Message</button>
            <span class="visually-hidden" id="contact-status" role="status" aria-live="polite"></span>
          </form>
        </div>
        <div class="contact-success" id="contact-success" hidden>
          <div class="success-mark" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <h2 id="contact-success-title" tabindex="-1">Message sent!</h2>
          <p>Thanks for reaching out. We'll be in touch soon.</p>
          <button class="contact-send" type="button" data-close-contact>Close</button>
        </div>
      </div>
    </dialog>
  </body>
</html>
