<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f2">
    <meta name="description" content="Ottomated. Coming soon.">
    <title>Ottomated | Coming Soon</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="landing">
      <div class="sculpture" aria-hidden="true">
        <div class="aura"></div>
        <div class="ground-shadow"></div>
        <svg class="orbit orbit-back" viewBox="0 0 320 240" fill="none">
          <defs>
            <linearGradient id="rail" x1="40" y1="140" x2="284" y2="188" gradientUnits="userSpaceOnUse">
              <stop stop-color="#c5c4cd"/>
              <stop offset=".45" stop-color="#efeff2"/>
              <stop offset="1" stop-color="#b0acbf"/>
            </linearGradient>
          </defs>
          <ellipse cx="160" cy="164" rx="124" ry="37" transform="rotate(-13 160 164)" stroke="url(#rail)" stroke-width="1.5"/>
        </svg>
        <div class="buddy-float">
          <div class="buddy">
            <div class="face">
              <span class="eye"></span>
              <span class="eye"></span>
            </div>
          </div>
        </div>
        <svg class="orbit orbit-front" viewBox="0 0 320 240" fill="none">
          <path d="M36 164a124 37 0 0 0 248 0" transform="rotate(-13 160 164)" stroke="url(#rail)" stroke-width="1.5"/>
        </svg>
        <div class="satellite-plane">
          <div class="satellite-position"><div class="satellite"></div></div>
        </div>
      </div>
      <h1>Ottomated</h1>
      <p>Coming soon</p>
    </main>
  </body>
